<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <center>
         <form action="./sign in.html">
            <center><b>Sign up</b></center><br><br>
            <div class="container">
                <center>
                    <label for="user">Username<span style="color:  red;">*</span>:</label>
                    <input type="text" id="user" name="user" placeholder="Enter your username" required><br>
                    <label for="email">Email<span style="color:  red;" >*</span>:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required><br>
                    <label for="pass">Password<span style="color:  red;">*</span>:</label>
                    <input type="text" id="pass" name="Password" placeholder="Enter your password" required><br>
                    <label for="cfmpass">Confirm Password<span style="color:  red;">*</span>:</label>
                    <input type="text" id="cfmpass" name="crmpass" placeholder="re-enter password" required><br><br>
                    <button type="submit">Submit</button><br><br>
                    <label>Already have an account?</label>&ensp;&ensp;
                    <a href="./sign in.html">Login</a>
                </center>
            </div>
        </form>
    </center>
   
</body>
</html>
