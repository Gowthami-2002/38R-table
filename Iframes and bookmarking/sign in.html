<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
</head>
<body>
    <center>
         <form action="https://www.youtube.com/">
            <center><b>Sign in</b></center><br>
            <div class="container">
                <center>
                    <label for="user">Username<span style="color:  red;">*</span>:</label>
                    <input type="text" id="user" name="user" placeholder="Enter your username" required><br>
                    <label for="pass">Password<span style="color:  red;">*</span>:</label>
                    <input type="text" id="pass" name="Password" placeholder="Enter your password" required><br>
                </center>
            </div>
            <div>
                <input type="checkbox" name="remember"> 
                <label for="remember">Remember me</label><br><br>
                <button type="submit" >Login</button><br><br>
            </div>
            <div>
                <button type="button" name="cancelbtn">Cancel</button>&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;
                <a href="./forgot password.html">Forgot Password</a><br>
            </div>
        </form>
    </center>
   
</body>
</html>
